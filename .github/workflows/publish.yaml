name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "dockerfiles/**"
      - "wordlists/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_generated_files:
    name: Update generated files
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Make README file
        run: python scripts/make_readme.py

      - name: Make JSON file
        run: python scripts/make_json.py

      - name: Check if there are any changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Update README file
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: update generated files [skip ci]"
          git push

      - name: Get release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_and_push_docker_images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: update_generated_files
    strategy:
      matrix:
        image: [alpine, debian, scratch, ubuntu]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update_generated_files.outputs.commit_sha }}

      - name: Unzip rockyou
        run: |
          cd wordlists/famous
          unzip -o rockyou.zip
          rm rockyou.zip

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate tag
        id: tag
        run: |
          echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dockerfiles/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kkrypt0nn/wordlists:${{ matrix.image }}-latest
            kkrypt0nn/wordlists:${{ matrix.image }}-${{ steps.tag.outputs.tag }}
