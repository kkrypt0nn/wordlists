name: Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "wordlists/**"
      - "dockerfiles/**"
  workflow_dispatch:

jobs:
  build_and_push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [alpine, debian, scratch, ubuntu]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unzip rockyou
        run: |
          cd wordlists/famous
          unzip -o rockyou.zip
          rm rockyou.zip

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate tag
        id: tag
        run: |
          echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dockerfiles/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kkrypt0nn/wordlists:${{ matrix.image }}-latest
            krypt0nn/wordlists:${{ matrix.image }}-${{ needs.generate_tag.outputs.tag }}
